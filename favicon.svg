<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Sensor Gridlines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- High-Precision Telemetry Waveform -->
  <path d="M10 32h10l4-15 8 30 6-22 5 13 4-6h7" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Peak Indicator Point -->
  <circle cx="24" cy="17" r="2.8" fill="#ffffff" filter="url(#glow)"/>
</svg>
